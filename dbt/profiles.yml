# Connection to the local Postgres 17 from compose.yaml.
# The host defaults to localhost (inside Airflow it is the "postgres" service).
# The password is read from the POSTGRES_PASSWORD environment variable, never written here.
telemetry:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: 5432
      user: telemetry
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: telemetry
      schema: dbt
      threads: 4
    # Same project on Snowflake: dbt build --target snowflake
    # Key-pair authentication: only the path to the private key is configured, never a password.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: ACCOUNTADMIN
      warehouse: telemetry_wh
      database: telemetry
      schema: dbt
      threads: 4
